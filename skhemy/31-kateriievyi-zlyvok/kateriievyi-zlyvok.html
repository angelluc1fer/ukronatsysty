html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden}
.fshell{display:flex;flex-direction:column;height:100%;min-height:0}

.sw{display:inline-block;width:18px;height:3px;border-radius:2px}

#svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.belt-line{fill:none;stroke-width:var(--bw);vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.hit{fill:none;stroke:transparent;stroke-width:16px;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:stroke}
.belt-line{stroke:var(--ci,var(--i9))} .ar{fill:var(--ci,var(--i9))}
[data-belt="mk"] .belt-line{stroke:var(--cm,var(--mk1))} [data-belt="mk"] .ar{fill:var(--cm,var(--mk1))}
[data-belt="dark"] .belt-line{stroke:var(--beltdark)} [data-belt="dark"] .ar{fill:var(--beltdark)}
.ar{stroke:none}
.zero .belt-line{stroke-dasharray:7 4}
.neck .belt-line{filter:none}
.neck .hit{stroke:transparent}
.dot{fill:var(--dot);stroke:var(--m-edge);stroke-width:1px;vector-effect:non-scaling-stroke;r:calc(var(--dr)*1px)}
.gl{stroke:var(--grid8);stroke-width:1px;vector-effect:non-scaling-stroke}

.hull{stroke:var(--m-edge);stroke-width:1.2px;vector-effect:non-scaling-stroke;rx:.6}
.t-smelt .hull{fill:var(--m-smelt)} .t-cons .hull{fill:var(--m-cons)} .t-gen .hull{fill:var(--m-gen)} .t-bore .hull{fill:var(--m-bore)} .t-store .hull{fill:var(--m-store)} .t-sink .hull{fill:var(--m-sink)} .t-rail .hull{fill:var(--m-rail)} .t-ref .hull{fill:var(--m-ref)}

.t-split .sp{fill:var(--split)} .t-merge .sp{fill:var(--merge)} .t-smart .sp{fill:var(--smart)} .t-prog .sp{fill:var(--prog)} .t-prio .sp{fill:var(--prio)}
text{font-family:var(--lab);fill:var(--ink)}

.nid{font-weight:600;fill:var(--node-ink);text-anchor:middle;dominant-baseline:central;font-size:calc(var(--k)*1.75px)}

.lb text.cap{font-size:calc(var(--k)*1.5px);fill:var(--ink2)}

.pct.ins{stroke:none}

[data-z="1"] .lb text.cap,[data-z="2"] .lb text.cap{display:none}

  const route = (a, b) => { const mx = a[0] < b[0] ? (a[0] + b[0]) / 2 : a[0] + 5; return a[1] === b[1] ? [a, b] : [a, [mx, a[1]], [mx, b[1]], b]; };
  function drawFloor() {

  const fitIfOpen = () => { if (cur === 'fl' && svg && svg.isConnected) fit(); };
  function apply() {

      L.el.setAttribute('transform', `translate(${OX + L.x * S} ${OY + y * S - (L.fr && !det ? (n - 1) * 7 : 0)})${L.rot ? ' rotate(-90)' : ''}`);

  }
  function fit() { if (!svg) return; const r = svg.getBoundingClientRect(), P = D.plate, x0 = -30, x1 = P.w + 6, w = x1 - x0, hh = P.h + 12; if (r.width < 10) return; S = Math.min(r.width / w, r.height / hh) * .97; OX = (r.width - w * S) / 2 - x0 * S; OY = (r.height - hh * S) / 2 + 4 * S; apply(); }
  function zoom(f, cx, cy) { const r = svg.getBoundingClientRect(); cx = cx == null ? r.width / 2 : cx; cy = cy == null ? r.height / 2 : cy; const n = Math.min(40, Math.max(.2, S * f)), q = n / S; OX = cx - (cx - OX) * q; OY = cy - (cy - OY) * q; S = n; apply(); }

      .catch(function (why) { show(why === 'ліміт' ? 'Не вдалося завантажити: ліміт запитів GitHub, спробуй за годину.' : 'Не вдалося завантажити коментарі (немає звʼязку з GitHub).'); });
  }

  // хук для мапи й інших сторінок
  window['коментар'] = function (o) {
    o = o || {}; if (o.місце != null) place = String(o.місце).replace(/\s+/g, ' ').slice(0, 200);
    if (o.текст != null) { draft = String(o.текст).slice(0, 1500); ta.value = draft; }
    open = true; sync(); if (!list) load(); return newUrl();
  };
  window['коментар'].url = newUrl;
  sync();
  (document.body || document.documentElement).appendChild(root);
  // кількість відкритих — одразу, щоб було видно на кнопці (кеш на 5 хв спільний для сторінок вкладки → ≈ 1 запит на 5 хв)
  load();
})();
