<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

.eg .hit{stroke:transparent;stroke-width:16px;cursor:pointer}
.be .cs{stroke:var(--case);stroke-width:calc(var(--bw) + 2px)}.be .co{stroke:var(--c);stroke-width:var(--bw)}

.ic{width:18px;height:18px;vertical-align:-4px;margin-right:4px}.ic.big{width:40px;height:40px;margin:0}
.st{display:inline-block;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:999px}.st-ok.st{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.st-part.st{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.st-off.st{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.go{margin:8px 0;width:100%;font-weight:600;border-color:var(--acc);color:var(--acc)}
ul.pl{padding-left:18px;margin:6px 0}ul.pl li{margin:5px 0}ul.pl li.urg{color:var(--bad)}
ul.leg{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:4px}ul.leg i{display:inline-block;width:26px;height:6px;border-radius:3px;margin-right:8px;vertical-align:middle;background:var(--mut)}

<script>window.SCHEMA_SPEC={"назва":"Модульні рами","файл":"04-аванпост-друга/модульні_рами","примітка":"Богдан · Залізна руда · Модульна рама · мітка «Аванпост друга» · 04-аванпост-друга · як збудовано з сейва: будівлі, стрічки, такти й правила Розумних розгалужувачів · зал 13 × 16 фундаментів на 4 поверхах + блок дротів","кроки":["Почни з «Що виправити» — кроки по черзі, цифри в кружечках на схемі.","Зал — 13 × 16 фундаментів на 4 поверхах: 1 — Плавильні заліза й Сплавлений дріт, 2 — Залізна плита й Залізний стрижень, 3 — Прошита залізна плита й Модульна рама, 4 — Комп’ютери. Кожен поверх — до 3 × 4 креслеників Проєктувальника 2 (рамки №1–№42), блок дротів на z −30 — ще 4 (№49–№52).","Кроки креслеників — автоматичні з сейва: що там стоїть і що заходить чи виходить через краї (стики).","Натисни будівлю, стрічку чи трубу — картка з тактом і потоком: розрахунок / гра; такт можна змінити «що як»."],"перевірити":["Комп’ютери: стрічки дротів до Збирачів повні, а Виробникам бракує Надпровідного дроту — звірити в грі, куди саме йде дріт.","Виробник «Швидкісний роз’єм» на 250 % працює на 94 % — чи потрібен такий такт (уламки)."],"увага":["Подачі з-за меж ділянки: Мідна руда (≈ 220 м на сх) і Катерієва руда (Бурильник 2 ≈ 160 м на пд-сх) — на схемі «джерела» біля краю.","Кресленики не будувались як Проєктувальник 2: рамки 40 × 40 покладено на сітку фундаментів залу, тож машини на межі рамок зʼєднано стиками."],"виправити":[{"що":"Вивіз Модульних рам: стрічка з Контейнера рам (поверх 3) обривається одразу за Конвеєрним зʼєднувачем — довести до станції «Аванпост друга» (підіймач ≈ 38 м вниз і ≈ 66 м стрічки до Вантажної платформи)","де":"№27:К1","чому":"Контейнер рам повний (1 200 з 1 200), вивозу нема — уся лінія з 120 машин стоїть з 21.10. Це запит 1 для Логістики: далі — потяг у Хаб."},{"що":"9 східних Збирачів «Модульна рама» (поверх 3, кресленики В1–В3) — без вихідної стрічки: підʼєднати до лінії рам","де":"№30:Зб1","чому":"Вони роблять рами лише до свого буфера й стають; з 18 Збирачів на вихід працюють 9 західних."},{"що":"Перелив рам у ДИВО-передавач: Розумний розгалужувач перед Контейнером рам — «Модульна рама» у контейнер, надлишок — у ДИВО-передавач","де":"№27:К1","чому":"Правило «нічого не стоїть»: коли контейнер повний або потяг не приїхав, лінія не зупиняється (як Варіант А на Енергостанції). Рам на карті 2 395 — не горить, але завод працює весь час."}],"дорожня_карта":[{"назва":"1 · Поверх 1 — 32 Плавильні «Залізний зливок»","стан":"готово","дає":"до 960 Залізних зливків за хв (руди — 480: 8 Бурильників 2 на бідних жилах)","деталі":"Стоїть: вихід підпирає вище — рами нікуди вивезти."},{"назва":"2 · Поверх 2 — 20 Будівників «Залізна плита», 32 «Залізний стрижень»","стан":"готово","дає":"плити й стрижні на Збирачі поверху 3"},{"назва":"3 · Поверх 3 — 10 Збирачів «Прошита залізна плита», 18 «Модульна рама»","стан":"частково","дає":"до 36 Модульних рам за хв (за рудою ≈ 17,8)","деталі":"9 східних Збирачів рам — без виходу («Що виправити» 2)."},{"назва":"4 · Дроти (z −30): Мідні й Катерієві зливки, Надпровідний дріт; Сплавлений дріт — поверх 1","стан":"готово","дає":"Сплавлений дріт на Прошиту залізну плиту, Надпровідний дріт на Комп’ютери","деталі":"Мідна й Катерієва руда — з-за меж ділянки; усе «вихід забитий»."},{"назва":"5 · Поверх 4 — Комп’ютери: Комп’ютер, Суперкомп’ютер, Швидкісний роз’єм, Обмежувач ШІ","стан":"частково","дає":"до 33 за хв разом","деталі":"Бракує Пластику (возять вручну) і Надпровідного дроту; плата — 4 684 у контейнері."},{"назва":"6 · Вивіз рам: станція «Аванпост друга» → потяг у Хаб","стан":"не збудовано","дає":"Модульні рами на склад-станцію Хаба","деталі":"Запит 1 у черзі; платформи станції є (z −8), стрічки до них — нема."}],"сейв":"23.10 00:38","креслення":{"Поверх 1 · А1":{"назва":"«Поверх 1 · А1» · Залізний зливок ×6","проєктувальник":2,"розмір":[40,40],"будівлі":[{"id":"Пл2","тип":"SmelterMk1","x":29.02,"y":27.05,"z":1.56,"напрям":"сх","рецепт":"IngotIron"},{"id":"Пл4","тип":"SmelterMk1","x":29 <script>// розрахунок.js — креслення Проєктувальника → граф будівель → очікувані потоки за хвилину.
// Спільний для сторінки (window.Rozrah) і node (require). Формат spec — README.md.
(function (root) {
'use strict';
const BELT = [0, 60, 120, 270, 480, 780, 1200], PIPE = [0, 300, 600], INF = 1e9, EPS = 1e-7;
const DIR = { 'сх': 0, 'пд': 90, 'зх': 180, 'пн': 270, 'a+': 0, 'c+': 90, 'a-': 180, 'c-': 270 };
const PUR = { 'бідна': .5, 'нормальна': 1, 'багата': 2 };
const DESIGNER = { 1: 32, 2: 40, 3: 48 };
const ROUTE = new Set(['split', 'merge', 'hub', 'joint', 'pass']);
const rad = d => d * Math.PI / 180;
function rot(x, y, d) { const c = Math.cos(rad(d)), s = Math.sin(rad(d)); return [x * c - y * s, x * s + y * c]; }
function clockOf(b) { const t = b['такт']; if (t == null || t === '') return 100; return typeof t === 'number' ? t : parseFloat(String(t).replace(',', '.')) || 100; }
function shards(c) { return c <= 100 + 1e-9 ? 0 : Math.ceil((c - 100) / 50 - 1e-9); }
function powerAt(base, c) { return base * Math.pow(c / 100, 1.321928); }
function bpGeom(bp) { const S = DESIGNER[bp['проєктувальник'] || 2] || 40; const [W, D] = bp['розмір'] || [S, S]; return { S, W, D }; }

// ---------------------------------------------------------------- розгортання
function expand(SP, DT, only) {
  const nodes = [], edges = [], byId = {}, errs = [], warns = [], frames = [];
  const BP = SP['креслення'] || {};
  const ID = { inst: '', rot: 0, z: 0, pt: (x, y) => [x, y] };
  function mkT(g, ins) {
    const r = +(ins['поворот'] || 0), sw = r % 180 ? g.D : g.W, sd = r % 180 ? g.W : g.D;
    return { inst: ins['№'], clocks: ins['такти'] || {}, rot: r, z: +(ins.z || 0), pt: (x, y) => { const [u, v] = rot(x - g.W / 2, y - g.D / 2, r); return [ins.x + sw / 2 + u, ins.y + sd / 2 + v]; }, sw, sd };
  }
  function mkNode(b, pre, T, bpId) {
    const ty = DT.types[b['тип']];
    if (!b.id) { errs.push(`будівля без id (${b['тип']})`); return; }
    if (!ty) { errs.push(`${pre}${b.id}: невідомий тип «${b['тип']}» (див. node tools\\схема\\схема.js будівлі)`); return; }
    const a0 = b['поворот'] != null ? +b['поворот'] : (DIR[b['напрям'] || 'пд'] ?? 90);
    const [x, y] = T.pt(+b.x || 0, +b.y || 0), z = T.z + (+b.z || 0), ang = a0 + T.rot, id = pre + b.id;
    if (byId[id]) { errs.push(`повторний id ${id}`); return; }
    const c = T.clocks && T.clocks[b.id] != null ? clockOf({ 'такт': T.clocks[b.id] }) : clockOf(b);

      if (/joint|inlet|outlet/.test(n.kind)) continue;
      let cell;
      if (n.l > 0 && n.w > 0) { const c = Math.abs(Math.cos(n.a0 * Math.PI / 180)), s = Math.abs(Math.sin(n.a0 * Math.PI / 180)), hx = c * n.l / 2 + s * n.w / 2, hy = s * n.l / 2 + c * n.w / 2, a = cellName(n.lx - hx + .01, n.ly - hy + .01), b = cellName(n.lx + hx - .01, n.ly + hy - .01); cell = a === b ? a : a + '–' + b; } else cell = cellName(n.lx, n.ly);
      const ports = Object.values(n.ports).filter(p => p.used).map(p => `${PN(p.id)} h ${f1(p.z)}`).join(' · ');
      rows.push(`<tr><td>${link(n)}<div class="mut sm">${esc(n.kind === 'machine' ? rn(n.recipe) : n.name)}</div></td><td><b>${cell}</b></td><td>${f1(n.lx)}; ${f1(n.ly)}${n.lz ? '; h ' + f1(n.lz) : ''}</td><td class="sm">${n.w > 2.1 ? 'виходи на ' + DIRN(n.a0) + '<br>' : ''}${esc(ports)}</td></tr>`);
    }
    return `<h3>Клітинки і висоти · «${esc(V.only)}»</h3><p class="mut sm">Проєктувальник ${g.W}×${g.D} м. Колонки А–Д — X (зх → сх), ряди 1–5 — Y (пн → пд), клітинка = 8 м = фундамент. Центр будівлі: X; Y; h — висота над підлогою креслення. «Висоти портів» — де підʼєднується стрічка чи труба.</p><table class="io"><tr><th>будівля</th><th>клітинка</th><th>центр (м)</th><th>виходи й висоти портів</th></tr>${rows.join('')}</table>`;
  },
  comm() {
    const ks = Object.keys(COMM); if (!ks.length) return '<h3>Коментарі</h3><p>Поки порожньо. Натисни будівлю, лінію чи вставку — унизу картки є поле «Коментар». Коментарі зберігаються в цьому браузері; кнопка «Скопіювати все» кладе їх у буфер — вставиш у чат.</p>';
    const lab = k => k[0] === 'n' ? k.slice(2) : k[0] === 'i' ? 'вставка ' + k.slice(2) : 'лінія ' + k.slice(2), txt = ks.map(k => `${lab(k)} — ${COMM[k]}`).join('\n');
    return `<h3>Коментарі · ${ks.length}</h3><ul class="pl">${ks.map(k => `<li>${k[0] === 'e' ? '' : `<a data-go="${esc(k.slice(2))}">`}<b>${esc(lab(k))}</b>${k[0] === 'e' ? '' : '</a>'}: ${esc(COMM[k])}</li>`).join('')}</ul><textarea class="cm" id="cmall" rows="5" readonly>${esc(txt)}</textarea><div class="cmb"><button data-copy="1">Скопіювати все</button></div>`;
  }
};

// ---------------------------------------------------------------- події інтерфейсу
document.addEventListener('click', ev => {
  const b = ev.target.closest('button, a[data-go]'); if (!b) return;
  if (b.dataset.v) openView(views.find(x => x.id === b.dataset.v));
  else if (b.dataset.f) { floor = b.dataset.f; document.querySelectorAll('#floors button').forEach(x => x.classList.toggle('on', x === b)); draw(); fit(); }
  else if (b.dataset.z) { const c = [stage.clientWidth / 2, stage.clientHeight / 2]; b.dataset.z === 'fit' ? fit() : zoomAt(...c, b.dataset.z === 'in' ? 1.5 : 1 / 1.5); }
  else if (b.dataset.a === 'steady') { V.steady = !V.steady; R.solve(V.G, DT, V.over, null, V.steady); draw(); if (sel && sel.t === 'p') panel('prob'); else renderCard(); }
  else if (b.dataset.a) panel(b.dataset.a);
  else if (b.dataset.cm) { const ta = card.querySelector('textarea.cm'); if (ta) { const key = ta.dataset.key, t = ta.value.trim(); if (b.dataset.cm === 'save' && t) COMM[key] = t; else delete COMM[key]; saveComm(); commBtn(); draw(); renderCard(); } }
  else if (b.dataset.copy) { const ta = $('cmall'); if (ta) { ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); } b.textContent = 'Скопійовано ✓'; } }
  else if (b.classList.contains('x')) closeCard();
  else if (b.dataset.view) openView(views.find(x => x.id === b.dataset.view));
  else if (b.dataset.go) {
    const id = b.dataset.go;
    if (b.dataset.k === 'e') { const e = byE(id); if (e) { const p = e.pts[Math.floor(e.pts.length / 2)]; select({ t: 'e', id }); centerOn(p[0], p[1]); } }
    else { const n = V.G.byId[id], fr = n ? null : V.G.frames.find(q => (q.inst || q.bp) === id); if (n) { if (!onFloor(n.z)) { floor = 'all'; document.querySelectorAll('#floors button').forEach(x => x.classList.toggle('on', x.dataset.f === 'all')); draw(); } select({ t: 'n', id }); centerOn(n.x, n.y); }
      else if (fr) { if (!onFloor(fr.z)) { floor = 'all'; document.querySelectorAll('#floors button').forEach(x => x.classList.toggle('on', x.dataset.f === 'all')); draw(); } select({ t: 'i', id }); centerOn(fr.x + fr.w / 2, fr.y + fr.d / 2, Math.min(k, 3)); } }
  } else if (b.dataset.c && sel && sel.t === 'n') setClock(sel.id, b.dataset.c === 'reset' ? null : +b.dataset.c);
  else if (b.dataset.t && sel && sel.t === 'e') { const e = byE(sel.id), lk = 'лінія:' + e.a.id + '.' + e.ap; if (b.dataset.t === 'reset' || +b.dataset.t === e.t0) delete V.over[lk]; else V.over[lk] = +b.dataset.t; R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard(); }
  else if (b.dataset.prop != null) { const i = +b.dataset.prop; V.over = i < 0 ? {} : Object.assign({}, SP['пропозиції'][i]['такти']); V.steady = i >= 0 && hasBuf(); R.solve(V.G, DT, V.over, null, V.steady); draw(); panel('clk'); }   // пропозиції — у «прогнозі»: як буде, коли все усталиться
});
document.addEventListener('change', ev => { if (ev.target.matches('.clk input') && sel && sel.t === 'n') setClock(sel.id, Math.min(250, Math.max(1, +ev.target.value || 100))); });
function setClock(id, c) {
  const n = V.G.byId[id]; if (c == null || c === n.clock0) delete V.over[id]; else V.over[id] = c;
  R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard();
}
openView(views[0]);
let fitted = stage.clientWidth > 80 && stage.clientHeight > 80;   // сторінка могла завантажитись у прихованій вкладці
if (window.ResizeObserver) new ResizeObserver(() => { if (!fitted && stage.clientWidth > 80 && stage.clientHeight > 80) { fitted = true; fit(); } }).observe(stage);
})();
</script>
</body></html>
