(function () {
  if (window.__КМ_ЖИВИЙ) return; window.__КМ_ЖИВИЙ = 1;
  var REPO = 'angelluc1fer/ukronatsysty', SITE = 'https://angelluc1fer.github.io/ukronatsysty/', KEY = 'km:open:v1', TTL = 5 * 60 * 1000, enc = encodeURIComponent;
  var C = window.__КМ || {}, PATH = String(C.шлях || 'index.html'), NAME = String(C.назва || document.title || PATH).replace(/\s+/g, ' ').trim().slice(0, 80);
  var place = '', draft = '', open = false, list = null;
  var css = '.km{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;z-index:1500;font:13px/1.35 var(--f-body,system-ui,sans-serif);color:var(--ink,#1F2328);max-width:calc(100vw - 20px);width:max-content}' +
    '.km *{box-sizing:border-box}.km-bar{display:flex;gap:0;box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:999px;overflow:hidden;border:1px solid var(--line,#D9D6CF);background:var(--card,#fff)}' +
    '.km-b{display:inline-block;padding:7px 12px;color:var(--ink,#1F2328);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;white-space:nowrap}' +
    '.km-b:hover{background:var(--box,#F3F1EC)}.km-n{border-left:1px solid var(--line,#D9D6CF);color:var(--acc,#2F6FB5);font-weight:600}' +
    '.km-p{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);width:min(340px,calc(100vw - 20px));max-height:min(60vh,420px);overflow:auto;background:var(--card,#fff);border:1px solid var(--line,#D9D6CF);border-radius:10px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.3)}' +
    '.km-p[hidden]{display:none}.km-h{font-weight:600;margin-bottom:6px}.km-m{color:var(--mut,#6B7078);font-size:12px}' +
    '.km-pl{background:var(--box,#F3F1EC);border:1px solid var(--line,#D9D6CF);border-radius:6px;padding:4px 8px;margin:6px 0;word-break:break-word}' +
    '.km-t{width:100%;min-height:54px;margin:4px 0;padding:6px;border:1px solid var(--line,#D9D6CF);border-radius:6px;background:var(--bg,#F4F2EE);color:inherit;font:inherit;resize:vertical}' +
    '.km-i{display:block;padding:6px 0;border-top:1px solid var(--line,#D9D6CF);color:inherit;text-decoration:none}.km-i:hover b{text-decoration:underline}.km-i b{display:block;word-break:break-word}' +
    '@media (max-width:600px){.km{bottom:6px}.km-b{padding:7px 10px}.km-l{display:none}}@media print{.km{display:none}}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  var pageUrl = SITE + PATH;
  function newUrl() {
    var body = 'Сторінка: ' + pageUrl + '\nМісце: ' + (place || '—') + '\n---\n\n' + draft;
    return 'https://github.com/' + REPO + '/issues/new?title=' + enc('[сторінка · ' + PATH + '] ' + NAME) + '&body=' + enc(body.slice(0, 3000));
  }
  var root = el('div', 'km'), panel = el('div', 'km-p'), bar = el('div', 'km-bar'),
      add = el('a', 'km-b'), cnt = el('button', 'km-b km-n', '▾');
  panel.hidden = true; add.target = '_blank'; add.rel = 'noopener'; add.title = 'Відкриє на GitHub форму нового коментаря до цієї сторінки (потрібен акаунт GitHub)';
  var addL = el('span', '', '💬 '), addT = el('span', 'km-l', 'Коментар'); add.appendChild(addL); add.appendChild(addT);
  cnt.type = 'button'; cnt.title = 'Відкриті коментарі до цієї сторінки'; cnt.setAttribute('aria-label', 'Коментарі до сторінки');
  bar.appendChild(add); bar.appendChild(cnt); root.appendChild(panel); root.appendChild(bar);

  var head = el('div', 'km-h', 'Коментарі до цієї сторінки'), plc = el('div', 'km-pl'), ta = el('textarea', 'km-t'), send = el('a', 'km-b', 'Написати на GitHub ↗'), note = el('div', 'km-m', 'Репозиторій публічний — не пиши секретів і адрес.'), lst = el('div');
  ta.placeholder = 'Твій коментар (за бажанням — його можна дописати вже на GitHub)'; send.target = '_blank'; send.rel = 'noopener'; send.style.cssText = 'border:1px solid var(--line,#D9D6CF);border-radius:999px;margin:2px 0 6px';
  [head, plc, ta, send, note, lst].forEach(function (x) { panel.appendChild(x); });

  function sync() {
    plc.textContent = 'Місце: ' + (place || '— (не вказано)'); plc.style.display = place ? '' : 'none';
    add.href = send.href = newUrl();
    cnt.textContent = (list ? list.length + ' ' : '') + (open ? '▴' : '▾'); panel.hidden = !open;
  }
  ta.addEventListener('input', function () { draft = ta.value; sync(); });
  cnt.addEventListener('click', function () { open = !open; sync(); if (open && !list) load(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) { open = false; sync(); } });

  function show(msg) { lst.textContent = ''; lst.appendChild(el('div', 'km-m', msg)); }
  function render() {
    lst.textContent = '';
    if (!list.length) { show('Відкритих коментарів до цієї сторінки нема.'); return; }
    list.forEach(function (i) {
      var a = el('a', 'km-i'); a.href = i.url; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('b', '', '#' + i.n + ' · ' + (i.text || i.title)));
      a.appendChild(el('span', 'km-m', (i.who || '') + ' · ' + i.date + (i.comments ? ' · відповідей ' + i.comments : '')));
      lst.appendChild(a);
    });
  }
  // issue належить сторінці: заголовок «[сторінка · <шлях>]» з нашим шляхом, або в тексті є адреса сторінки (так пишуть схеми для коментаря до елемента)
  function mine(i) {
    var m = /^\[(.+?) · (.+?)\]\s*([\s\S]*)$/.exec(i.title || '');
    if (m && m[1] === 'сторінка') return m[2] === PATH;
    var b = i.body || '', k = b.indexOf(pageUrl);
    return k >= 0 && !/[\w.\-\/]/.test(b.charAt(k + pageUrl.length));
  }
  function date(iso) { var d = new Date(iso); return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function fin(raw) {
    list = raw.filter(mine).map(function (i) {
      var m = /^\[(.+?) · (.+?)\]\s*([\s\S]*)$/.exec(i.title || ''), u = String(i.html_url || '');
      return { n: i.number, title: i.title || '', text: m ? m[3] : '', who: i.user && i.user.login || '', date: date(i.created_at), comments: i.comments | 0, url: u.indexOf('https://github.com/' + REPO + '/issues/') === 0 ? u : 'https://github.com/' + REPO + '/issues/' + (i.number | 0) };
    });
    render(); sync();
  }
  function load() {
    show('Завантажую…');
    try { var c = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (c && Date.now() - c.t < TTL) { fin(c.d); return; } } catch (e) {}
    if (!window.fetch) { show('Не вдалося завантажити коментарі.'); return; }
    fetch('https://api.github.com/repos/' + REPO + '/issues?state=open&per_page=100', { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (r) {
        if (r.status === 403 || r.status === 429) return Promise.reject('ліміт');
        return r.ok ? r.json() : Promise.reject('помилка');
      })
      .then(function (a) {
        var slim = a.filter(function (i) { return !i.pull_request; }).map(function (i) { return { number: i.number, title: i.title, body: (i.body || '').slice(0, 1500), user: i.user && { login: i.user.login }, created_at: i.created_at, html_url: i.html_url, comments: i.comments }; });
        try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d: slim })); } catch (e) {}
        fin(slim);
      })
      .catch(function (why) { show(why === 'ліміт' ? 'Не вдалося завантажити: ліміт запитів GitHub, спробуй за годину.' : 'Не вдалося завантажити коментарі (немає звʼязку з GitHub).'); });
  }

  // хук для мапи й інших сторінок
  window['коментар'] = function (o) {
    o = o || {}; if (o.місце != null) place = String(o.місце).replace(/\s+/g, ' ').slice(0, 200);
    if (o.текст != null) { draft = String(o.текст).slice(0, 1500); ta.value = draft; }
    open = true; sync(); if (!list) load(); return newUrl();
  };
  window['коментар'].url = newUrl;
  sync();
  (document.body || document.documentElement).appendChild(root);
  // кількість відкритих — одразу, щоб було видно на кнопці (кеш на 5 хв спільний для сторінок вкладки → ≈ 1 запит на 5 хв)
  load();
})();
</script></body></html>
