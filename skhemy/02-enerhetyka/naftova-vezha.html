<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нафтова енергетика · вежа з цистерн</title><style>:root{--man:#8E44AD;--bg:#F4F2EE;--card:#FFFFFF;--ink:#1F2328;--mut:#6B7078;--line:#D9D6CF;--plate:#ECE9E2;--frame:#FAF9F6;--g1:#E4E1DA;--g4:#D6D2C9;--g8:#BFBAAF;--ok:#2E8B57;--warn:#C77700;--bad:#C8382C;--acc:#2F6FB5;--case:#FFFFFF;--box:#F3F1EC;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--man:#C39BE0;--bg:#15181B;--card:#1E2226;--ink:#E6E3DD;--mut:#9AA0A8;--line:#33383E;--plate:#1A1E21;--frame:#1C2024;--g1:#23282C;--g4:#2C3237;--g8:#3D444B;--ok:#4CC27F;--warn:#E8A33A;--bad:#F06A5C;--acc:#6EA8F0;--case:#0E1012;--box:#262B30;color-scheme:dark}}
:root[data-theme="dark"]{--man:#C39BE0;--bg:#15181B;--card:#1E2226;--ink:#E6E3DD;--mut:#9AA0A8;--line:#33383E;--plate:#1A1E21;--frame:#1C2024;--g1:#23282C;--g4:#2C3237;--g8:#3D444B;--ok:#4CC27F;--warn:#E8A33A;--bad:#F06A5C;--acc:#6EA8F0;--case:#0E1012;--box:#262B30;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body)}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}

.ttl h1{margin:0;font-size:17px;line-height:1.2}.ttl .sub{color:var(--mut);font-size:12.5px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}

.chip.gen{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.whatif{color:var(--acc);border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.floors,.acts{display:flex;gap:6px;flex-wrap:wrap}#bprob.warn{border-color:var(--warn);color:var(--warn);font-weight:600}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}#svg:active{cursor:grabbing}
.zoom{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}.zoom button{width:36px;height:36px;padding:0;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hint{position:absolute;left:58px;bottom:14px;color:var(--mut);font-size:12px;pointer-events:none;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:2px 6px;border-radius:6px}
/* світ */
#world *{vector-effect:non-scaling-stroke}
.plate{fill:var(--plate);stroke:var(--g8);stroke-width:1.5px}
.frb{fill:var(--frame);stroke:var(--ink);stroke-width:1.4px;stroke-dasharray:7 4}.fr.sel .frb{stroke:var(--acc);stroke-width:3px}
.grid line{stroke-width:1px}.g1{stroke:var(--g1);display:none}.g4{stroke:var(--g4);display:none}.g8{stroke:var(--g8)}
.z2 .g4,.z3 .g4,.z3 .g1{display:inline}
.eg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.eg .hit{stroke:transparent;stroke-width:16px;cursor:pointer}
.be .cs{stroke:var(--case);stroke-width:calc(var(--bw) + 2px)}.be .co{stroke:var(--c);stroke-width:var(--bw)}
.pi .cs{stroke:var(--ink);stroke-width:calc(var(--pw) + 2.5px);opacity:.55}.pi .co{stroke:var(--c);stroke-width:var(--pw)}
/* шар «вручну» (24.10): звʼязки й будівлі поза кресленикми — фіолетові; стан (працює / стоїть / вузьке місце) лишається видимим */
.be.man .cs{stroke:var(--man);stroke-width:calc(var(--bw) + 4px)}.pi.man .cs{stroke:var(--man);opacity:.9;stroke-width:calc(var(--pw) + 4px)}
.nd .mh{fill:color-mix(in srgb,var(--man) 20%,transparent);stroke:var(--man);stroke-width:1.1px}
.eg.zero .co{stroke-dasharray:4 4;opacity:.55}.eg.neck .cs{stroke:var(--bad);opacity:1}
.lift{fill:var(--card);stroke:var(--c);stroke-width:2.5px}
.nd{cursor:pointer}.nd .bx{fill:var(--box);stroke:var(--ink);stroke-width:1.3px}.nd .sm{fill:var(--card);stroke:var(--ink);stroke-width:1.3px}
.nd .nose{fill:none;stroke:var(--mut);stroke-width:1.4px}.nd .jt{fill:var(--card);stroke:var(--acc);stroke-width:1.6px}
.k-machine .bx,.k-gen .bx,.k-source .bx{stroke:var(--c);stroke-width:2px}
.st-ok .bx{fill:color-mix(in srgb,var(--ok) 9%,var(--box))}.st-part .bx{fill:color-mix(in srgb,var(--warn) 18%,var(--box));stroke-dasharray:5 3}.st-off .bx{fill:color-mix(in srgb,var(--bad) 16%,var(--box));stroke:var(--bad);stroke-dasharray:3 3}
.k-sink .bx{fill:color-mix(in srgb,var(--acc) 12%,var(--box))}.k-split .sm,.k-merge .sm{fill:var(--ink)}.k-split .nose,.k-merge .nose{stroke:var(--card)}
.pt{fill:var(--card);stroke:var(--mut);stroke-width:1px}.pt.u{fill:var(--ink);stroke:var(--ink)}.z0 .pt,.z1 .pt,.z0 .nd .nose{display:none}   /* порти — лише близько (z2+), стрілка будівлі — не на «далеко» */
.dim .eg,.dim .nd{opacity:.22}.dim .up,.dim .dn,.dim .sel{opacity:1}
.eg.up .cs{stroke:var(--acc);opacity:1}.eg.dn .cs{stroke:var(--warn);opacity:1}.eg.sel .cs{stroke:var(--ink);opacity:1;stroke-width:calc(var(--bw) + 6px)}
.nd.up .bx,.nd.up .sm{stroke:var(--acc);stroke-width:2.6px}.nd.dn .bx,.nd.dn .sm{stroke:var(--warn);stroke-width:2.6px}.nd.sel .bx,.nd.sel .sm,.nd.sel .jt{stroke:var(--acc);stroke-width:3.6px}
/* підписи (екранний шар) */
#over{pointer-events:none}.lb rect{fill:color-mix(in srgb,var(--card) 88%,transparent);stroke:none}.lb text{fill:var(--ink);text-anchor:middle;font-family:var(--f-body);font-weight:600}
.lfr rect{fill:var(--ink)}.lfr text{fill:var(--bg);font-weight:800}.lfr.s rect{fill:color-mix(in srgb,var(--card) 85%,transparent)}.lfr.s text{fill:var(--mut);font-weight:600}
.lax rect{fill:none}.lax text{fill:var(--mut);font-family:var(--f-mono)}
.lnd.s rect{fill:var(--ink)}.lnd.s text{fill:var(--bg)}.lrc text{fill:var(--mut);font-weight:500}
.lpc text{font-family:var(--f-mono)}.lpc.st-ok text{fill:var(--ok)}.lpc.st-part text{fill:var(--warn)}.lpc.st-off text{fill:var(--bad)}
.led text{font-family:var(--f-mono)}.led.z text{fill:var(--mut)}.llf text{fill:var(--acc);font-family:var(--f-mono)}.lrz text{font-family:var(--f-mono);fill:var(--mut)}.ljt text{fill:var(--acc);font-weight:500}
.chev{fill:none;stroke:var(--ink);stroke-width:1.6px;opacity:.75}.chev.z{opacity:.25}
/* картка */
.card{position:absolute;top:10px;right:10px;width:380px;max-width:calc(100% - 20px);max-height:calc(100% - 20px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.card .x{position:absolute;top:8px;right:8px;width:30px;height:30px;padding:0;font-size:18px;border:none}
.card h3{margin:4px 0 8px;font-size:15px}.ch{display:flex;gap:10px;align-items:center;padding-right:28px;margin-bottom:8px}.ch b{font-size:16px}
.mut{color:var(--mut)}.sm{font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.ic{width:18px;height:18px;vertical-align:-4px;margin-right:4px}.ic.big{width:40px;height:40px;margin:0}
.st{display:inline-block;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:999px}.st-ok.st{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.st-part.st{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.st-off.st{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.row{margin:4px 0 8px}.kv{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin:6px 0}.kv>span:first-child{color:var(--mut);min-width:86px}
.clk{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0 2px}.clk>span:first-child{color:var(--mut);min-width:86px}.clk input{width:64px;font:600 14px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.clk button{padding:3px 7px;font-size:12.5px}.clk .rst{color:var(--acc);border-color:var(--acc)}
table.io{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}table.io th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;border-bottom:1px solid var(--line);padding:3px 4px}table.io td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}table.io td.ok,table.io td.bad{font:600 13px var(--f-mono)}
.lim{background:color-mix(in srgb,var(--warn) 10%,transparent);border-left:3px solid var(--warn);padding:6px 10px;margin:8px 0;border-radius:4px}.lim ul{margin:4px 0 0;padding-left:18px}
.fact{background:var(--box);padding:6px 10px;border-radius:6px;margin:8px 0;font-size:13px}.txt{margin:6px 0;font-size:13px}
.flow{font-size:14px;margin:6px 0 4px}.flow b{font:700 20px var(--f-mono)}.bar2{height:8px;background:var(--box);border-radius:4px;overflow:hidden;border:1px solid var(--line)}.bar2 i{display:block;height:100%}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--mut)}ul.dep{margin:6px 0;padding-left:18px}ul.dep li{margin:2px 0}
a[data-go]{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.rz{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 6px;border-radius:8px;background:var(--ink);color:var(--bg);font:800 15px var(--f-body)}.rz.big{font-size:17px}
.go{margin:8px 0;width:100%;font-weight:600;border-color:var(--acc);color:var(--acc)}
ul.pl{padding-left:18px;margin:6px 0}ul.pl li{margin:5px 0}ul.pl li.urg{color:var(--bad)}
ul.leg{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:4px}ul.leg i{display:inline-block;width:26px;height:6px;border-radius:3px;margin-right:8px;vertical-align:middle;background:var(--mut)}
ul.leg i.lb1{height:8px;background:var(--mut)}ul.leg i.lp1{height:6px;box-shadow:0 0 0 2px var(--ink)}ul.leg i.lz{background:repeating-linear-gradient(90deg,var(--mut) 0 4px,transparent 4px 8px)}ul.leg i.ln{box-shadow:0 0 0 2px var(--bad)}
ul.leg i.s{width:16px;height:12px;border-radius:3px;border:2px solid}ul.leg i.s.ok{border-color:var(--ok)}ul.leg i.s.part{border-color:var(--warn);border-style:dashed}ul.leg i.s.off{border-color:var(--bad);border-style:dotted}
@media (max-width:760px){.top{padding:8px 16px 4px}.bar{padding:6px 16px}.chips{margin-left:0}.hint{display:none}
.card{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;max-height:58%;border-radius:14px 14px 0 0}}

.acts button.hi{border-color:var(--acc);color:var(--acc);font-weight:600}
.lfix rect{fill:var(--warn)}.lfix text{fill:#fff;font-weight:800}.lfix.u rect{fill:var(--bad)}
ol.fx{list-style:none;padding:0;margin:6px 0;display:grid;gap:10px}ol.fx li{display:flex;gap:10px;align-items:flex-start}ol.fx .nb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}ol.fx li.u .nb{background:var(--bad)}
ol.road{padding-left:20px;margin:6px 0;display:grid;gap:10px}ol.road li.ok b{color:var(--ok)}ol.road li.no{opacity:.75}
svg.chart{width:100%;height:auto;margin:4px 0}svg.chart line{stroke:var(--line);stroke-width:1}svg.chart text{fill:var(--mut);font:10px var(--f-mono)}svg.chart polyline{fill:none;stroke-width:2.2}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-bottom:6px}.lgd i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.prop{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.rz.big.w{font-size:13px;height:auto;min-height:40px;max-width:110px;white-space:normal;text-align:center;line-height:1.15;padding:5px 7px}
.acts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lb.rzn text{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.5px}
/* Claude Code 22.10: коментарі, мін/макс по сейвах, кроки «що → чому» */
.lcm rect{fill:var(--acc)}.lcm text{fill:#fff;font-weight:800}
ol.stp{padding-left:20px;margin:6px 0;display:grid;gap:10px}.why{color:var(--mut);font-size:12.5px;margin-top:2px}
.hist{background:var(--box);padding:6px 10px;border-radius:6px;margin:8px 0;font-size:13px}.hist .mm{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0}.hist .mm b{font:700 14px var(--f-mono)}.hist svg.spark{display:block;margin-top:2px}
details.cmt{margin-top:10px}textarea.cm{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}.cmb{display:flex;gap:6px;margin-top:6px}
h4{margin:12px 0 4px;font-size:13px;color:var(--mut);font-weight:600}
/* розріз (п. 19) */
.cb{fill:color-mix(in srgb,var(--plate) 75%,var(--bg));stroke:var(--g8);stroke-width:1px}.cb.alt{fill:color-mix(in srgb,var(--plate) 35%,var(--bg))}
.cl{cursor:pointer}.cl .clb{fill:var(--frame);stroke:var(--ink);stroke-width:1.4px}.cl:hover .clb{stroke:var(--acc);stroke-width:3px}
.cl.st-ok .clb{stroke:var(--ok);stroke-width:2px}.cl.st-part .clb{stroke:var(--warn);stroke-width:2px;stroke-dasharray:5 3}.cl.st-off .clb{stroke:var(--bad);stroke-width:2px;stroke-dasharray:3 3}
.cl.out .clb{stroke:var(--mut);stroke-dasharray:2 3}.cbk-ok{fill:var(--ok)}.cbk-part{fill:var(--warn)}.cbk-off{fill:var(--bad)}
.eg.vl .co{stroke-linecap:butt}
/* шапка-меню на схемі (п. 20): tools\інфо\меню.js; над шапкою схеми, у потоці — не перекриває вкладки й панелі */
.shell{display:flex;flex-direction:column;height:100%}.shell>#app{height:auto;flex:1;min-height:0}
.shell>nav.menu{flex:none;margin:0;border-width:0 0 1px;border-radius:0;padding:4px 12px;position:relative;z-index:30}
.shell .mn-sub{margin:0}.shell .mn-sub>summary{font-weight:400;color:var(--ink)}.shell .mn-sub.cur>summary{font-weight:600;color:var(--bg)}
/* «показати на схемі» (п. 21): виділене — яскравий контур, що пульсує; усе інше (будівлі, стрічки, рамки, підписи й позначки) ≈ 0,08 */
@keyframes pls{0%,100%{stroke-width:3px}50%{stroke-width:8px}}
@keyframes plsc{0%,100%{stroke-width:calc(var(--bw) + 4px)}50%{stroke-width:calc(var(--bw) + 12px)}}
.focus .eg,.focus .nd,.focus .fr,.focus .plate,.focus .lift,.focus .cl,.focus .cb{opacity:.08}
.focus .foc,.focus .up,.focus .dn{opacity:1}
.focus .nd.foc .bx,.focus .nd.foc .sm,.focus .nd.foc .jt{stroke:var(--acc);animation:pls 1.1s ease-in-out infinite}
.focus .eg.foc .cs{stroke:var(--acc);opacity:1;animation:plsc 1.1s ease-in-out infinite}
.focus .fr.foc .frb{stroke:var(--acc);stroke-dasharray:none;animation:pls 1.1s ease-in-out infinite}
.focus .cl.foc .clb{stroke:var(--acc);stroke-dasharray:none;animation:pls 1.1s ease-in-out infinite}
.focus .eg.up .cs{stroke:var(--acc);opacity:1}.focus .eg.dn .cs{stroke:var(--warn);opacity:1}
#over.focus .lb,#over.focus .chev{opacity:.08}#over.focus .lb.foc,#over.focus .chev.foc{opacity:1}
.focbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 28px 10px 0;padding:6px 8px;background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:8px}.focbar button{padding:3px 9px;font-size:13px;border-color:var(--acc);color:var(--acc);font-weight:600}.focbar button.on{background:var(--acc);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.focus .nd.foc .bx,.focus .nd.foc .sm,.focus .nd.foc .jt,.focus .eg.foc .cs,.focus .fr.foc .frb,.focus .cl.foc .clb{animation:none;stroke-width:5px}}
/* спільні коментарі через GitHub Issues (п. 18) */
.ghc{margin-top:10px}a.ghb{display:inline-block;padding:4px 10px;border:1px solid var(--acc);border-radius:8px;color:var(--acc);font-size:13px;text-decoration:none;background:var(--card)}a.ghb:hover{background:var(--acc);color:var(--card);text-decoration:none}
a.ghb.sm{padding:1px 8px;font-size:12px;margin-top:4px}
ul.ghl{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px}ul.ghl>li{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:6px 8px;background:var(--box);font-size:13px}ul.ghl>li.gh-closed{border-left-color:var(--ok);opacity:.75}
.ghs-open,.ghs-closed{font-size:11.5px;font-weight:700;padding:0 6px;border-radius:999px;color:#fff}.ghs-open{background:var(--warn)}.ghs-closed{background:var(--ok)}
.ghbody{margin-top:2px;white-space:pre-wrap;color:var(--mut)}

/* вкладка «Вручну»: модулі (вставки) приглушені, ручний шар — на повну */
.lman:not(.focus):not(.dim) .nd:not(.man),.lman:not(.focus):not(.dim) .eg:not(.man),.lman:not(.focus):not(.dim) .fr{opacity:.3}
ul.leg i.lmn{width:16px;height:12px;border-radius:3px;border:2px solid var(--man);background:color-mix(in srgb,var(--man) 20%,transparent)}
ol.stp.man li .why{margin-top:2px}
/* шапка-меню (23.10): однакова на всіх сторінках; tools\інфо\меню.js */
nav.menu{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;margin:0 0 14px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mn{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.mn-i,.mn-sub>summary{display:inline-block;padding:5px 10px;border-radius:8px;color:var(--ink);font-size:14px;line-height:1.3;list-style:none;cursor:pointer;text-decoration:none}
.mn-sub>summary::-webkit-details-marker{display:none}.mn-sub>summary::after{content:" ▾";color:var(--mut)}
a.mn-i:hover,.mn-sub>summary:hover{background:var(--box);text-decoration:none}
.mn-i.cur,.mn-sub.cur>summary{background:var(--ink);color:var(--bg);font-weight:600}.mn-sub.cur>summary::after{color:var(--bg)}
.mn-i.off{color:var(--mut);opacity:.5;cursor:default}
.mn-sub{position:relative}
.mn-list{position:absolute;z-index:20;left:0;top:calc(100% + 4px);min-width:230px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mn-meta{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;color:var(--mut);font-size:12.5px}.mn-meta b{color:var(--ink);font-weight:600}
a.mn-site{border:1px solid var(--line);border-radius:999px;padding:1px 9px}a.mn-cmt{color:var(--ink)}a.mn-cmt:hover{background:var(--box);text-decoration:none}

<script>// Клієнт спільних коментарів (з 23.10, п. 18): коментар = issue репозиторію сайту на GitHub (відкрито / закрито).
// Вбудовується в сторінки стану (tools\інфо\інфо.js) і схеми (tools\схема\схема.js) через tools\інфо\меню.js (MENU.gh) — один код, window.GHC.
//   GHC.newUrl(назва, текст)  — адреса форми нового issue з уже вписаними назвою й текстом (мітки через URL чужим не ставляться — мітка в назві: «[<ключ схеми або сторінка> · <елемент>] …»)
//   GHC.load(cb)              — читає issues (відкриті й закриті) через API без входу, кеш у sessionStorage на 5 хв; без інтернету — тихо нічого (cb не викликається)
//   GHC.list                  — розібрані issues після load: {n, scope, el, text, key, body, who, at, state, url, comments}
//   key — машинний ключ елемента схеми («n:id», «e:a→b», «i:id», «f:N»), береться з посилання «#к=…» у тексті issue (його кладе движок схем)
// Секретів тут нема й бути не повинно: усе публічне, вхід робить сам GitHub, ключів доступу тут нема.
(function () {
  var REPO = 'angelluc1fer/ukronatsysty', SITE = 'https://angelluc1fer.github.io/ukronatsysty/', KEY = 'ghc:issues', TTL = 5 * 60 * 1000;
  var G = window.GHC = { repo: REPO, site: SITE, list: null, _w: [], _f: [], _busy: false };
  var enc = encodeURIComponent;
  G.NOTE = 'Репозиторій публічний — не вписуй сюди секретів і адрес.';
  G.parse = function (i) {
    var m = /^\[(.+?) · (.+?)\]\s*([\s\S]*)$/.exec(i.title || ''), b = i.body || '', k = /#к=([^\s)>\]]+)/.exec(b), body = b.indexOf('\n---') >= 0 ? b.slice(b.indexOf('\n---') + 4) : b;
    var key = ''; if (k) { try { key = decodeURIComponent(k[1]); } catch (e) { key = k[1]; } }
    return m ? { n: i.number, scope: m[1], el: m[2], text: m[3], key: key, body: body.replace(/^\s+|\s+$/g, ''), who: i.user && i.user.login, at: i.created_at, state: i.state, url: i.html_url, comments: i.comments } : null;
  };
  G.newUrl = function (title, body) { return 'https://github.com/' + REPO + '/issues/new?title=' + enc(title) + '&body=' + enc(String(body).slice(0, 3000)); };
  G.date = function (iso) { var d = new Date(iso); return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
  G.onSite = function () { return /github\.io$/.test(location.hostname) && location.pathname.indexOf('/ukronatsysty/') === 0; };
  G.pagePath = function (fallback) { if (!G.onSite()) return fallback; var q = location.pathname.slice('/ukronatsysty/'.length); return q || 'index.html'; };   // шлях сторінки на сайті
  G.pageUrl = function (fallback) { return G.onSite() ? location.origin + location.pathname : (fallback || SITE); };
  function done(raw) { G.list = raw.map(G.parse).filter(Boolean); G._busy = false; var w = G._w; G._w = []; w.forEach(function (f) { try { f(G.list); } catch (e) {} }); }
  function fail() { G._busy = false; var f = G._f; G._f = []; G._w = []; f.forEach(function (x) { try { x(); } catch (e) {} }); }
  G.load = function (cb, bad) {
    if (G.list) { cb(G.list); return; }
    G._w.push(cb); if (bad) G._f.push(bad); if (G._busy) return; G._busy = true;
    try { var c = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (c && Date.now() - c.t < TTL) { done(c.d); return; } } catch (e) {}
    if (!window.fetch) { fail(); return; }
    var all = [];
    (function next(p) {
      fetch('https://api.github.com/repos/' + REPO + '/issues?state=all&per_page=100&page=' + p, { cache: 'no-cache', headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (a) {
          all = all.concat(a.filter(function (i) { return !i.pull_request; }));
          if (a.length === 100 && p < 3) return next(p + 1);
          var slim = all.map(function (i) { return { number: i.number, title: i.title, body: (i.body || '').slice(0, 2000), user: i.user && { login: i.user.login }, created_at: i.created_at, state: i.state, html_url: i.html_url, comments: i.comments }; });
          try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d: slim })); } catch (e) {}
          done(slim);
        })
        .catch(fail);   // без інтернету / ліміт API — тихо нічого
    })(1);
  };
  // «Коментар до сторінки» у шапці-меню (id="mn-cmt", data-path — шлях сторінки на сайті; на сайті шлях беремо з адреси)
  function pageBtn() {
    var a = document.getElementById('mn-cmt'); if (!a) return;
    var p = G.pagePath(a.getAttribute('data-path') || ''), u = G.pageUrl(G.site + encodeURI(p));
    a.href = G.newUrl('[сторінка · ' + p + '] ', 'Сторінка: ' + u + '\n' + G.NOTE + '\n---\n\n');
    G.load(function (L) {
      var o = L.filter(function (i) { return i.scope === 'сторінка' && i.el === p && i.state === 'open'; });
      if (o.length) { a.textContent = '💬 Коментар до сторінки · ' + o.length + ' відкрито'; a.title = 'Відкриті коментарі до цієї сторінки: ' + o.map(function (i) { return '#' + i.n; }).join(', ') + ' — github.com/' + REPO + '/issues'; }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pageBtn); else pageBtn();
})();
</script>

document.addEventListener('click', ev => {
  const b = ev.target.closest('button, a[data-go], a[data-gk]'); if (!b) return;
  if (b.dataset.gk) { gotoKey(b.dataset.gk); return; }
  if (b.dataset.v) openView(views.find(x => x.id === b.dataset.v));
  else if (b.dataset.f) setFloor(b.dataset.f);
  else if (b.dataset.z) { const c = [stage.clientWidth / 2, stage.clientHeight / 2]; b.dataset.z === 'fit' ? fit() : zoomAt(...c, b.dataset.z === 'in' ? 1.5 : 1 / 1.5); }
  else if (b.dataset.a === 'steady') { V.steady = !V.steady; R.solve(V.G, DT, V.over, null, V.steady); draw(); if (sel && sel.t === 'p') panel('prob'); else renderCard(); }
  else if (b.dataset.a) panel(b.dataset.a);
  else if (b.dataset.cm) { const ta = card.querySelector('textarea.cm'); if (ta) { const key = ta.dataset.key, t = ta.value.trim(); if (b.dataset.cm === 'save' && t) COMM[key] = t; else delete COMM[key]; saveComm(); commBtn(); draw(); renderCard(); } }
  else if (b.dataset.copy) { const ta = $('cmall'); if (ta) { ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); } b.textContent = 'Скопійовано ✓'; } }
  else if (b.dataset.chain) { FOC.chain = !FOC.chain; highlight(sel); place(); renderCard(); }
  else if (b.classList.contains('x')) closeCard();
  else if (b.dataset.view) openView(views.find(x => x.id === b.dataset.view));
  else if (b.dataset.go) {
    focusOn(b.dataset.go.split('|'), b.dataset.k);   // п. 21: виділити лише це, решта прозора
  } else if (b.dataset.c && sel && sel.t === 'n') setClock(sel.id, b.dataset.c === 'reset' ? null : +b.dataset.c);
  else if (b.dataset.t && sel && sel.t === 'e') { const e = byE(sel.id), lk = 'лінія:' + e.a.id + '.' + e.ap; if (b.dataset.t === 'reset' || +b.dataset.t === e.t0) delete V.over[lk]; else V.over[lk] = +b.dataset.t; R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard(); }
  else if (b.dataset.prop != null) { const i = +b.dataset.prop; V.over = i < 0 ? {} : Object.assign({}, SP['пропозиції'][i]['такти']); V.steady = i >= 0 && hasBuf(); R.solve(V.G, DT, V.over, null, V.steady); draw(); panel('clk'); }   // пропозиції — у «прогнозі»: як буде, коли все усталиться
});
document.addEventListener('click', ev => {   // «Надіслати на GitHub»: у форму йде те, що зараз у полі чернетки (навіть не збережене)
  const a = ev.target.closest('a.ghs'); if (!a || !GHC) return;
  const ta = [...card.querySelectorAll('textarea.cm[data-key]')].find(x => x.dataset.key === a.dataset.key);
  a.href = ghUrl(a.dataset.key, ta ? ta.value.trim() : COMM[a.dataset.key] || '');
}, true);
document.addEventListener('change', ev => { if (ev.target.matches('.clk input') && sel && sel.t === 'n') setClock(sel.id, Math.min(250, Math.max(1, +ev.target.value || 100))); });
// елемент за ключем коментаря → ids для focusOn у поточному вигляді
function keyIds(key) {
  const t = key[0], id = key.slice(2);
  if (t === 'n' || t === 'i') return { ids: [id] };
  if (t === 'e') { const e = V.G.edges.find(q => q.a.id + '→' + q.b.id === id); return e ? { ids: [e.id], kind: 'e' } : null; }
  if (t === 'f') { const q = (SP['виправити'] || [])[+id - 1]; return q ? { ids: [].concat(q['де'] || []) } : null; }
  return null;
}
function gotoKey(key) {   // «показати на схемі» для коментаря: шукає елемент у поточному вигляді, потім в інших
  const home = V, tryV = v => { if (V !== v) openView(v); const a = keyIds(key); if (!a || !mkFocus(a.ids, a.kind).objs.length) return false; focusOn(a.ids, a.kind); return true; };
  if (tryV(V)) return true;
  for (const v of views) if (v !== home && tryV(v)) return true;
  if (V !== home) openView(home);
  return false;
}
function ghRefresh() {
  draw(); commBtn();
  if (sel) { if (sel.t === 'p' && sel.kind === 'fix') sel.html = fixHtml(); renderCard(); }
}
function setClock(id, c) {
  const n = V.G.byId[id]; if (c == null || c === n.clock0) delete V.over[id]; else V.over[id] = c;
  R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard();
}
openView(views[0]);
if (GHC) GHC.load(L => { ISS = L.filter(i => SCH_KEYS.includes(i.scope)); ghRefresh(); }, () => { GH_FAIL = true; if (sel && sel.kind === 'comm') renderCard(); });
{ let hs = location.hash || ''; try { hs = decodeURIComponent(hs); } catch (e) {} const hm = /[#&]к=([^&]+)/.exec(hs); if (hm) setTimeout(() => { try { gotoKey(hm[1]); } catch (e) {} }, 120); }   // посилання з коментаря GitHub відкриває елемент на схемі
let fitted = stage.clientWidth > 80 && stage.clientHeight > 80;   // сторінка могла завантажитись у прихованій вкладці
if (window.ResizeObserver) new ResizeObserver(() => { if (!fitted && stage.clientWidth > 80 && stage.clientHeight > 80) { fitted = true; fit(); } }).observe(stage);
})();
</script>
