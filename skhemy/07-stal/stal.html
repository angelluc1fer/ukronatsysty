<script>window.SCHEMA_SPEC={"назва":"Сталь","файл":"07-сталь/сталь","ключ":"07-сталь/сталь","примітка":"Богдан · Залізна руда + Вугілля + Вапняк · Промислова балка + Сталева труба · мітка «Промислова балка» (у грі; поставити «Сталь») · 07-сталь · як збудовано з сейва: будівлі, стрічки, такти й правила Розумних розгалужувачів","кроки":["Почни з «Що виправити» — кроки по черзі, цифри в кружечках на схемі.","Будівля — 24 кресленик(ів) Проєктувальника 2, кожен — повна рамка 40 × 40 м, на трьох поверхах: поверх 1 — Бетон (рамки під 45°), поверх 2 — Залізний зливок, Сталевий зливок і Сталева труба, поверх 3 — Промислова балка (Збирачі й ДИВО-передавачі). Що стоїть на межі рамок, зʼєднано стиками на краях.","Натисни будівлю, стрічку чи трубу — картка з тактом і потоком: розрахунок / гра; такт можна змінити «що як». Звʼязок зі змішаних ланок показує в картці, яка ланка обмежує.","Бурильники (вапняк, залізна руда, вугілля) стоять на жилах за 100–330 м від будівлі — на схемі вони на своїх місцях, поза рамками; станції з 4 платформами — «споживачі» біля краю ділянки."],"перевірити":["Ливарня «Міцний сталевий зливок» №17:Лв1: у грі даних про роботу нема («—»), у схемі Вугілля не доходить, а сусідні Ливарні в тій самій рамці — на 100 %. Чи не обірвана гілка стрічки Вугілля до неї?","Станції на Сталі: у сейві один розклад — єдина зупинка «Захід − Модульна плата −». Чи є потяг, якому дати розклад «Північ → Південь → … Хаб»?"],"увага":["Кожне креслення — повна рамка 40 × 40 м (Проєктувальник 2), рамки не обрізані по будівлях; нарізані так, щоб межі йшли між машинами (цегляна кладка по смугах). Бетонна лінія (поверх 1) збудована під 45° — її рамки повернуті на 45°; решта — вздовж осей ділянки.","Кілька машин усе ж лежать на межі рамки (до 3 м: поверх 2 — Ливарні й Плавильні; поверх 3 — ДИВО-передавач): у грі вони стоять не по сітці 40 м. Це ℹ-попередження «виходить за межі креслення», не помилка.","ℹ про перекриття до 1 м (Плавильні, Ливарні, Збирачі, Будівники поруч зі Зʼєднувачами) — габарити з довідника трохи більші за ті, що в грі: машини стоять упритул. Не помилка.","Запас і буст: Бурильники не на 100 % (вапняк 70 %, вугілля 41 %, залізна руда 39 %) — їх стримують не вони, а розподіл труб і вивіз. 7 Енергетичних уламків (вапняк 5, вугілля 2) не знімати, поки лінія не вийде на 64 балки за хв; буст більше не потрібен — машин вистачає (28 Будівників «Бетон» проти ≈ 21 потрібних).","ДИВО-передавачі ×2 (поверх 3): живлення є (по 30 МВт), приймають лише перелив — коли обидва виходи на платформи заповнені; платформи повні, тож зараз балки йдуть у них. Перевірено за сейвом 23.10 00:38.","Подача за межею ділянки: станції (4 платформи) — «споживачі» біля краю; потік — те, що туди дає лінія."],"виправити":[{"що":"Вивезти Промислові балки з 4 вантажних платформ: потяг має заїжджати на станції «− Північ − Промислові балки» і «− Південь − Промислові Балки» (розклад; колія до Хаба — запит 4 для Логістики)","де":"Спож1","терміново":true,"чому":"Платформи повні: 4 × 4 800 = 19 200 Промислових балок (майже всі балки на карті), а Хаб чекає 20 175. У сейві один розклад з єдиною зупинкою «Захід − Модульна плата −» — на Сталь потяг не заходить. Нова продукція йде лише в ДИВО-передавачі (перелив, коли виходи на платформи заповнені) — тобто згорає в очки."},{"що":"7 ланок стрічок на шляху Сталевої труби й Сталевого зливка — рівнем вище: Конвеєрна стрічка 2 → 3 (№16:З1 → №24:Р1; №10:З1 → №19:Р1) і Конвеєрна стрічка 1 → 2 (№11:Лв1 → №11:З3; №11:З1 → №10:З1; №11:З2 → №11:З1; №11:Лв2 → №11:З5; №11:З4 → №11:З2)","де":"№16:З1","чому":"Ці ланки працюють на 91–95 % свого рівня й не віддають Збирачам Промислової балки стільки труб, скільки треба: Збирачі в хвості рядів — на 5–35 %. Розрахунок схеми: Промислові балки 30,8 → 45,5 за хв (у грі зараз 37 з 64). Усі 7 — у пропозиції «Стрічки труб і зливків» («Що як»)."},{"що":"Сталеві балки для колії й вагонів — два Будівники «Сталева балка» біля Ливарень (≈ 30 за хв) — запит 5","де":"№17:Лв3","чому":"Колія й вагони без Сталевих балок не будуються (на карті їх 61), а Сталевого зливка вистачає: Ливарень 13 × 60 = 780 за хв за номіналом, у грі зараз ≈ 290."}],"пропозиції":[{"назва":"Стрічки труб і зливків — рівнем вище","чому":"7 ланок на шляху Сталевої труби й Сталевого зливка (Конвеєрна стрічка 1 → 2, 2 → 3) працюють на 91–95 %.","підсумок":"Промислові балки 30,8 → 45,5 за хв (розрахунок схеми; далі впирається розподіл труб до Збирачів у хвості рядів).","такти":{"лінія:№16:З1.out1":3,"лінія:№11:Лв1.out1":2,"лінія:№11:З1.out1":2,"лінія:№11:З2.out1":2,"лінія:№10:З1.out1":3,"лінія:№11:Лв2.out1":2,"лінія:№11:З4.out1":2}}],"дорожня_карта":[{"назва":"1 · Залізний зливок (поверх 2)","стан":"готово","дає":"510 зливків за хв за номіналом (у грі ≈ 190)","деталі":"4 Бурильники 2 на залізній руді (100 %) → 17 Плавильень «Залізний зливок»; працюють на 37 %, бо далі не забирають."},{"назва":"2 · Сталевий зливок (поверх 2)","стан":"частково","дає":"780 за хв за номіналом (у грі ≈ 290)","деталі":"13 Ливарень «Міцний сталевий зливок»; Вугілля — 1 Бурильник 2 (багата жила, 200 %, 480 за хв); №17:Лв1 не працює — «Що перевірити»."},{"назва":"3 · Сталева труба (поверх 2)","стан":"частково","дає":"440 за хв за номіналом (у грі ≈ 195)","деталі":"22 Будівники «Сталева труба»; шлях до Збирачів — стрічки 1–2 на 91–95 % («Що виправити» 2)."},{"назва":"4 · Бетон (поверх 1, під кутом 45°)","стан":"готово","дає":"420 за хв за номіналом (у грі ≈ 176)","деталі":"28 Будівників «Бетон», вапняк — 4 Бурильники 2 (3 × 150 %, 1 × 200 %). Бетону більше, ніж треба: 64 балки за хв беруть ≈ 320."},{"назва":"5 · Промислова балка (поверх 3)","стан":"частково","дає":"64 за хв за номіналом (у грі ≈ 37)","деталі":"16 Збирачів («Промислова труба» — Сталева труба + Бетон) у 4 рядах; перші два в ряду — на 100 %, останні — на 5–35 %."},{"назва":"6 · Вивіз: 4 вантажні платформи, 2 станції","стан":"не працює","дає":"Промислові балки в Хаб і на колію","деталі":"Платформи повні (4 × 4 800), у розкладі станцій нема; перелив — у 2 ДИВО-передав     const st = v => { const a = v.filter(x => x != null); return a.length ? [Math.round(Math.min(...a)), Math.round(a.reduce((x, y) => x + y, 0) / a.length), Math.round(Math.max(...a)), Math.round(a.at(-1))] : ['—', '—', '—', '—']; };
    const spread = Object.entries(HIST['вузли']).map(([id, o]) => { const v = Object.values(o.p); return v.length > 2 ? [id, Math.min(...v), Math.max(...v)] : null; }).filter(x => x && x[2] - x[1] >= 5).sort((a, b) => (b[2] - b[1]) - (a[2] - a[1])).slice(0, 10);
    return `<h3>Робота машин по сейвах · ${S.length}</h3><p class="mut sm">Середня робота за останні 5 хв перед кожним сейвом, %. Автосейви — кожні 5 хв (+ ручні). Група = середнє по її машинах; мін / середнє / макс — по сейвах.</p>${c}
<div class="lgd">${series.map((s, k) => `<span><i style="background:${PAL[k % PAL.length]}"></i>${esc(s.name)}</span>`).join('')}</div>
<table class="io"><tr><th>група</th><th>мін</th><th>серед.</th><th>макс</th><th>зараз</th></tr>${series.map(s => `<tr><td>${esc(s.name)}</td>${st(s.v).map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>
${spread.length ? `<h4>Найбільший розкид</h4><ul class="pl">${spread.map(([id, a, b]) => `<li><a data-go="${esc(id)}">${esc(id)}</a>: ${a} … ${b} %</li>`).join('')}</ul>` : ''}`;
  },
  cells() {
    const G = V.G, bp = SP['креслення'][V.only] || {}, g = R.bpGeom(bp), rows = [];
    for (const n of G.nodes) {
      if (/joint|inlet|outlet/.test(n.kind)) continue;
      let cell;
      if (n.l > 0 && n.w > 0) { const c = Math.abs(Math.cos(n.a0 * Math.PI / 180)), s = Math.abs(Math.sin(n.a0 * Math.PI / 180)), hx = c * n.l / 2 + s * n.w / 2, hy = s * n.l / 2 + c * n.w / 2, a = cellName(n.lx - hx + .01, n.ly - hy + .01), b = cellName(n.lx + hx - .01, n.ly + hy - .01); cell = a === b ? a : a + '–' + b; } else cell = cellName(n.lx, n.ly);
      const ports = Object.values(n.ports).filter(p => p.used).map(p => `${PN(p.id)} h ${f1(p.z)}`).join(' · ');
      rows.push(`<tr><td>${link(n)}<div class="mut sm">${esc(n.kind === 'machine' ? rn(n.recipe) : n.name)}</div></td><td><b>${cell}</b></td><td>${f1(n.lx)}; ${f1(n.ly)}${n.lz ? '; h ' + f1(n.lz) : ''}</td><td class="sm">${n.w > 2.1 ? 'виходи на ' + DIRN(n.a0) + '<br>' : ''}${esc(ports)}</td></tr>`);
    }
    return `<h3>Клітинки і висоти · «${esc(V.only)}»</h3><p class="mut sm">Проєктувальник ${g.W}×${g.D} м. Колонки А–Д — X (зх → сх), ряди 1–5 — Y (пн → пд), клітинка = 8 м = фундамент. Центр будівлі: X; Y; h — висота над підлогою креслення. «Висоти портів» — де підʼєднується стрічка чи труба.</p><table class="io"><tr><th>будівля</th><th>клітинка</th><th>центр (м)</th><th>виходи й висоти портів</th></tr>${rows.join('')}</table>`;
  },
  comm() {
    const ks = Object.keys(COMM); if (!ks.length) return '<h3>Коментарі</h3><p>Поки порожньо. Натисни будівлю, лінію чи вставку — унизу картки є поле «Коментар». Коментарі зберігаються в цьому браузері; кнопка «Скопіювати все» кладе їх у буфер — вставиш у чат.</p>';
    const lab = k => k[0] === 'n' ? k.slice(2) : k[0] === 'i' ? 'вставка ' + k.slice(2) : 'лінія ' + k.slice(2), txt = ks.map(k => `${lab(k)} — ${COMM[k]}`).join('\n');
    return `<h3>Коментарі · ${ks.length}</h3><ul class="pl">${ks.map(k => `<li>${k[0] === 'e' ? '' : `<a data-go="${esc(k.slice(2))}">`}<b>${esc(lab(k))}</b>${k[0] === 'e' ? '' : '</a>'}: ${esc(COMM[k])}</li>`).join('')}</ul><textarea class="cm" id="cmall" rows="5" readonly>${esc(txt)}</textarea><div class="cmb"><button data-copy="1">Скопіювати все</button></div>`;
  }
};

// ---------------------------------------------------------------- події інтерфейсу
document.addEventListener('click', ev => {
  const b = ev.target.closest('button, a[data-go]'); if (!b) return;
  if (b.dataset.v) openView(views.find(x => x.id === b.dataset.v));
  else if (b.dataset.f) setFloor(b.dataset.f);
  else if (b.dataset.z) { const c = [stage.clientWidth / 2, stage.clientHeight / 2]; b.dataset.z === 'fit' ? fit() : zoomAt(...c, b.dataset.z === 'in' ? 1.5 : 1 / 1.5); }
  else if (b.dataset.a === 'steady') { V.steady = !V.steady; R.solve(V.G, DT, V.over, null, V.steady); draw(); if (sel && sel.t === 'p') panel('prob'); else renderCard(); }
  else if (b.dataset.a) panel(b.dataset.a);
  else if (b.dataset.cm) { const ta = card.querySelector('textarea.cm'); if (ta) { const key = ta.dataset.key, t = ta.value.trim(); if (b.dataset.cm === 'save' && t) COMM[key] = t; else delete COMM[key]; saveComm(); commBtn(); draw(); renderCard(); } }
  else if (b.dataset.copy) { const ta = $('cmall'); if (ta) { ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); } b.textContent = 'Скопійовано ✓'; } }
  else if (b.dataset.chain) { FOC.chain = !FOC.chain; highlight(sel); place(); renderCard(); }
  else if (b.classList.contains('x')) closeCard();
  else if (b.dataset.view) openView(views.find(x => x.id === b.dataset.view));
  else if (b.dataset.go) {
    focusOn(b.dataset.go.split('|'), b.dataset.k);   // п. 21: виділити лише це, решта прозора
  } else if (b.dataset.c && sel && sel.t === 'n') setClock(sel.id, b.dataset.c === 'reset' ? null : +b.dataset.c);
  else if (b.dataset.t && sel && sel.t === 'e') { const e = byE(sel.id), lk = 'лінія:' + e.a.id + '.' + e.ap; if (b.dataset.t === 'reset' || +b.dataset.t === e.t0) delete V.over[lk]; else V.over[lk] = +b.dataset.t; R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard(); }
  else if (b.dataset.prop != null) { const i = +b.dataset.prop; V.over = i < 0 ? {} : Object.assign({}, SP['пропозиції'][i]['такти']); V.steady = i >= 0 && hasBuf(); R.solve(V.G, DT, V.over, null, V.steady); draw(); panel('clk'); }   // пропозиції — у «прогнозі»: як буде, коли все усталиться
});
document.addEventListener('change', ev => { if (ev.target.matches('.clk input') && sel && sel.t === 'n') setClock(sel.id, Math.min(250, Math.max(1, +ev.target.value || 100))); });
function setClock(id, c) {
  const n = V.G.byId[id]; if (c == null || c === n.clock0) delete V.over[id]; else V.over[id] = c;
  R.solve(V.G, DT, V.over, null, V.steady); draw(); renderCard();
}
openView(views[0]);
let fitted = stage.clientWidth > 80 && stage.clientHeight > 80;   // сторінка могла завантажитись у прихованій вкладці
if (window.ResizeObserver) new ResizeObserver(() => { if (!fitted && stage.clientWidth > 80 && stage.clientHeight > 80) { fitted = true; fit(); } }).observe(stage);
})();
</script>
</body></html>
