html,body{height:100%}

  const route = (a, b) => { const mx = a[0] < b[0] ? (a[0] + b[0]) / 2 : a[0] + 5; return a[1] === b[1] ? [a, b] : [a, [mx, a[1]], [mx, b[1]], b]; };
  function drawFloor() {

  const fitIfOpen = () => { if (cur === 'fl' && svg && svg.isConnected) fit(); };
  function apply() {

    for (const L of labs) {

      if (L.fr) { n = px >= 40 ? 1 : 0; if (px >= 130) n = 2; if (px >= 190) n = 3; if (det) { n = 3; y = L.y0 + 5; } }

      L.el.setAttribute('transform', `translate(${OX + L.x * S} ${OY + y * S - (L.fr && !det ? (n - 1) * 7 : 0)})${L.rot ? ' rotate(-90)' : ''}`);

  }
  function fit() { if (!svg) return; const r = svg.getBoundingClientRect(), P = D.plate, x0 = -30, x1 = P.w + 6, w = x1 - x0, hh = P.h + 12; if (r.width < 10) return; S = Math.min(r.width / w, r.height / hh) * .97; OX = (r.width - w * S) / 2 - x0 * S; OY = (r.height - hh * S) / 2 + 4 * S; apply(); }
  function zoom(f, cx, cy) { const r = svg.getBoundingClientRect(); cx = cx == null ? r.width / 2 : cx; cy = cy == null ? r.height / 2 : cy; const n = Math.min(40, Math.max(.2, S * f)), q = n / S; OX = cx - (cx - OX) * q; OY = cy - (cy - OY) * q; S = n; apply(); }

      .catch(function (why) { show(why === 'ліміт' ? 'Не вдалося завантажити: ліміт запитів GitHub, спробуй за годину.' : 'Не вдалося завантажити коментарі (немає звʼязку з GitHub).'); });
  }

  // хук для мапи й інших сторінок
  window['коментар'] = function (o) {
    o = o || {}; if (o.місце != null) place = String(o.місце).replace(/\s+/g, ' ').slice(0, 200);
    if (o.текст != null) { draft = String(o.текст).slice(0, 1500); ta.value = draft; }
    open = true; sync(); if (!list) load(); return newUrl();
  };
  window['коментар'].url = newUrl;
  sync();
  (document.body || document.documentElement).appendChild(root);
  // кількість відкритих — одразу, щоб було видно на кнопці (кеш на 5 хв спільний для сторінок вкладки → ≈ 1 запит на 5 хв)
  load();
})();
